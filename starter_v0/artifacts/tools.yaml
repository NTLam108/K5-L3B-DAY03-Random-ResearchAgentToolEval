# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Ask the user one question and wait for their next message. No data is fetched.
      USE when: (1) a required argument is missing and not present anywhere in the conversation
      — e.g. the user asks for "the latest tweets" without saying whose account and without a topic,
      or says "this article / bài này" without a URL;
      (2) ALWAYS before any send / post / publish / đăng / gửi action, to get an explicit yes/no confirmation.
      DO NOT use when: the conversation already contains the needed info (use it directly),
      or the request is out of scope (just answer in text).
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "One short, specific question in the user's language. For a send confirmation, include the exact text that would be sent (or the digest being referred to)."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "'text' = ask for missing info (account, URL, topic). 'yes_no' = confirmation before a send/post/publish action — ALWAYS use yes_no for that, even if the content is not clear yet. 'choice' = pick one of `options`."}
        options: {type: array, default: [], items: {type: string}, description: "Only for response_type='choice': the list of options. Leave empty otherwise."}
      required: [question]

  - name: timeline
    description: >-
      Get the most recent posts FROM ONE specific X/Twitter account.
      USE when: the user names a person or account and wants what THEY posted
      ("tweet của Sam Altman", "Elon Musk vừa đăng gì").
      DO NOT use when: the user asks what people say ABOUT a topic (use social_search);
      or no account is named — never guess an account, call clarify instead.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle WITHOUT '@'. Map well-known names to their handle, e.g. Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy. Must not be empty."}
        limit: {type: integer, default: 5, description: "Number of posts — use exactly the number the user asked for (latest correction wins); default 5 if not stated."}
      required: [screenname]

  - name: social_search
    description: >-
      Search X/Twitter posts ABOUT a topic or keyword, from any account.
      USE when: the user explicitly wants posts/tweets/discussion on Twitter/X about a topic
      ("mọi người đang bàn gì về GPT-5 trên Twitter", "tweet về AI").
      DO NOT use when: the user wants posts from one specific account (use timeline);
      the user asks for news / tin tức without mentioning Twitter/X (use lookup);
      the user said to stop using Twitter; or there is no topic (query would be empty) — call clarify instead.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic keywords only, e.g. 'GPT-5', 'AI', 'OpenAI'. Must not be empty."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "'Top' when the user asks for popular / nổi bật / hot / most-engaged posts; 'Latest' when they ask for newest / mới nhất or don't specify."}
        limit: {type: integer, default: 5, description: "Number of posts the user asked for; default 5."}
      required: [query]

  - name: lookup
    description: >-
      Web search (news sites, blogs, general web) via Tavily.
      USE when: the user asks for news / tin tức / what happened (today, this week…) or general information on the web.
      This is the DEFAULT tool for "tin tức / news" unless the user explicitly asks for Twitter/X.
      DO NOT use when: the user gives a concrete URL to read (use fetch);
      the user wants tweets from an account (timeline) or tweets about a topic (social_search).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Core topic keywords only, e.g. 'AI', 'robotics', 'OpenAI'. Do NOT add words like 'news', 'tin tức', 'today', 'hôm nay' — express those with topic and timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "'news' when the user asks for news / tin tức / current events; 'general' for background or reference lookups."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day = today / hôm nay / last 24h; week = this week / tuần này; month = this month; year = this year. Keep the timeframe from earlier turns unless the user changes it."}
        max_results: {type: integer, default: 5, description: "Number of results; default 5."}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Post a text message to the team's private Telegram channel. This is an ACTION with a real side effect.
      USE only after the user has explicitly confirmed (said yes) to a clarify(response_type='yes_no')
      question that showed the exact text to send.
      DO NOT call this as the first response to "đăng / gửi / post lên Telegram" — call clarify with
      response_type='yes_no' first. Never use send to answer the user or to deliver your own reply.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Exact message text the user confirmed. Never invent content."}
        confirmed: {type: boolean, default: false, description: "true ONLY if the user explicitly said yes to sending this exact text in the conversation; otherwise false (the tool will refuse to send)."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
